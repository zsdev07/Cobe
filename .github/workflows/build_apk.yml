name: Build Cobe APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/build_deps.yml'

jobs:
  build-apk:
    name: Flutter Build -> Debug APK
    runs-on: ubuntu-22.04

    env:
      NDK_VERSION: "27.0.12077973"
      FLUTTER_VERSION: "3.24.5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check third_party libs exist
        run: |
          set -euo pipefail
          MISSING=0
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            for LIB in sqlcipher argon2; do
              F="src/cpp/third_party/${LIB}/${ABI}/lib${LIB}.a"
              if [ ! -f "$F" ]; then
                echo "Missing: $F"
                MISSING=1
              else
                echo "Found: $F ($(du -sh "$F" | cut -f1))"
              fi
            done
          done

          if [ $MISSING -eq 1 ]; then
            echo ""
            echo "ERROR: Native deps missing."
            echo "Run the 'Build Native Dependencies' workflow first."
            exit 1
          fi

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"

          set +e
          yes | sudo "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -e

          sudo "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${{ env.NDK_VERSION }}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build debug APK
        run: |
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk/${{ env.NDK_VERSION }}"
          flutter build apk --debug
          
      - name: Rename APKs
        run: |
          set -euo pipefail
          VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}')
          cd build/app/outputs/flutter-apk/
          ls *.apk
          for f in *.apk; do
            mv "$f" "cobe-${VERSION}-${f}"
          done
          echo "Final APKs:"
          ls *.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: cobe-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 60
