name: Build Native Dependencies

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_deps.yml'
      - 'src/cpp/CMakeLists.txt'
      - 'src/cpp/engine.h'

jobs:
  build-deps:
    name: Compile SQLCipher + Argon2 → Android ABIs
    runs-on: ubuntu-22.04

    env:
      NDK_VERSION: "27.0.12077973"
      API_LEVEL: "26"
      SQLCIPHER_TAG: "v4.5.7"
      ARGON2_REF: "20190702"
      FMT_TAG: "10.2.1"
      OPENSSL_TAG: "openssl-3.3.2"
      OUT: ${{ github.workspace }}/src/cpp/third_party

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "ndk;${{ env.NDK_VERSION }}" 2>/dev/null
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool tcl pkg-config make

      # ── Clone all sources ──────────────────────────────────────────────────
      - name: Clone sources
        run: |
          git clone --depth 1 --branch ${{ env.OPENSSL_TAG }} \
            https://github.com/openssl/openssl.git /tmp/openssl

          git clone --depth 1 --branch ${{ env.SQLCIPHER_TAG }} \
            https://github.com/sqlcipher/sqlcipher.git /tmp/sqlcipher
          cd /tmp/sqlcipher
          autoreconf --install --force 2>/dev/null || true

          git clone --depth 1 --branch ${{ env.ARGON2_REF }} \
            https://github.com/P-H-C/phc-winner-argon2.git /tmp/argon2

          git clone --depth 1 --branch ${{ env.FMT_TAG }} \
            https://github.com/fmtlib/fmt.git /tmp/fmt

          mkdir -p ${{ env.OUT }}/fmt/include
          cp -r /tmp/fmt/include/fmt ${{ env.OUT }}/fmt/include/

          mkdir -p ${{ env.OUT }}/argon2/include
          cp /tmp/argon2/include/argon2.h ${{ env.OUT }}/argon2/include/

      # ── Shared build function — inlined per ABI to avoid bash export issues ─

      # ══════════════════════════════════════════════════════════════════════
      # arm64-v8a
      # ══════════════════════════════════════════════════════════════════════
      - name: Build arm64-v8a
        run: |
          set -euo pipefail
          ABI="arm64-v8a"
          TRIPLE="aarch64-linux-android"
          OPENSSL_ARCH="android-arm64"

          TOOLCHAIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          CC="${TOOLCHAIN}/bin/${TRIPLE}${{ env.API_LEVEL }}-clang"
          CXX="${TOOLCHAIN}/bin/${TRIPLE}${{ env.API_LEVEL }}-clang++"
          AR="${TOOLCHAIN}/bin/llvm-ar"
          RANLIB="${TOOLCHAIN}/bin/llvm-ranlib"
          STRIP="${TOOLCHAIN}/bin/llvm-strip"
          OPENSSL_OUT="/tmp/openssl-${ABI}"

          # Verify compiler exists and works
          echo "--- Compiler check ---"
          ls "$CC"
          "$CC" --version
          echo "----------------------"

          # ── OpenSSL ───────────────────────────────────────────────────────
          echo "Building OpenSSL for ${ABI}..."
          cd /tmp/openssl
          make clean 2>/dev/null || true

          # OpenSSL's Configure handles Android cross-compile natively
          # ANDROID_NDK_ROOT must be set, PATH must include the toolchain
          export ANDROID_NDK_ROOT="${NDK_HOME}"
          export PATH="${TOOLCHAIN}/bin:${PATH}"

          perl Configure ${OPENSSL_ARCH} \
            -D__ANDROID_API__=${{ env.API_LEVEL }} \
            --prefix="${OPENSSL_OUT}" \
            --openssldir="${OPENSSL_OUT}/ssl" \
            no-shared no-tests no-ui-console no-asm \
            2>&1 | tail -5

          make -j$(nproc) build_libs 2>&1 | tail -10
          make install_dev 2>&1 | tail -5
          echo "OpenSSL headers: $(ls ${OPENSSL_OUT}/include/openssl/*.h | wc -l) files"

          # ── Argon2 ────────────────────────────────────────────────────────
          echo "Building Argon2 for ${ABI}..."
          mkdir -p ${{ env.OUT }}/argon2/${ABI}
          cd /tmp/argon2
          make clean 2>/dev/null || true
          make libargon2.a -j$(nproc) \
            CC="$CC" AR="$AR" RANLIB="$RANLIB" \
            CFLAGS="-O3 -fPIC --sysroot=${SYSROOT} -DANDROID"
          cp libargon2.a ${{ env.OUT }}/argon2/${ABI}/
          make clean

          # ── SQLCipher ─────────────────────────────────────────────────────
          echo "Building SQLCipher for ${ABI}..."
          mkdir -p ${{ env.OUT }}/sqlcipher/${ABI}
          cd /tmp/sqlcipher
          make distclean 2>/dev/null || true

          # Key flags for successful cross-compile:
          # --build=x86_64-linux-gnu        = host machine (runner)
          # --host=aarch64-linux-android    = target machine
          # ac_cv_func_* = disable autoconf runtime checks that can't run on target
          ./configure \
            --build=x86_64-linux-gnu \
            --host="${TRIPLE}" \
            CC="${CC} --sysroot=${SYSROOT}" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CFLAGS="-O3 -fPIC -DSQLITE_HAS_CODEC -DSQLITE_TEMP_STORE=2 -I${OPENSSL_OUT}/include" \
            LDFLAGS="-L${OPENSSL_OUT}/lib64 -L${OPENSSL_OUT}/lib" \
            LIBS="-lcrypto" \
            --enable-tempstore=yes \
            --with-crypto-lib=openssl \
            --disable-shared \
            --enable-static \
            ac_cv_func_posix_getpwuid_r=no \
            ac_cv_func_getpwuid_r=no \
            2>&1 | tail -10

          make -j$(nproc) libsqlcipher.la 2>&1 | tail -10

          # The .a lives in .libs/ after libtool builds it
          find . -name "libsqlcipher.a" | head -5
          find . -name "libsqlcipher.a" -exec cp {} ${{ env.OUT }}/sqlcipher/${ABI}/ \;

          # Copy generated header (only needed once — same across ABIs)
          mkdir -p ${{ env.OUT }}/sqlcipher/include
          cp sqlite3.h ${{ env.OUT }}/sqlcipher/include/
          echo "✓ ${ABI} complete"

      # ══════════════════════════════════════════════════════════════════════
      # armeabi-v7a
      # ══════════════════════════════════════════════════════════════════════
      - name: Build armeabi-v7a
        run: |
          set -euo pipefail
          ABI="armeabi-v7a"
          TRIPLE="armv7a-linux-androideabi"
          OPENSSL_ARCH="android-arm"

          TOOLCHAIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          CC="${TOOLCHAIN}/bin/${TRIPLE}${{ env.API_LEVEL }}-clang"
          AR="${TOOLCHAIN}/bin/llvm-ar"
          RANLIB="${TOOLCHAIN}/bin/llvm-ranlib"
          OPENSSL_OUT="/tmp/openssl-${ABI}"

          export ANDROID_NDK_ROOT="${NDK_HOME}"
          export PATH="${TOOLCHAIN}/bin:${PATH}"

          # ── OpenSSL ───────────────────────────────────────────────────────
          cd /tmp/openssl
          make clean 2>/dev/null || true
          perl Configure ${OPENSSL_ARCH} \
            -D__ANDROID_API__=${{ env.API_LEVEL }} \
            --prefix="${OPENSSL_OUT}" \
            --openssldir="${OPENSSL_OUT}/ssl" \
            no-shared no-tests no-ui-console no-asm \
            2>&1 | tail -5
          make -j$(nproc) build_libs 2>&1 | tail -10
          make install_dev 2>&1 | tail -5

          # ── Argon2 ────────────────────────────────────────────────────────
          mkdir -p ${{ env.OUT }}/argon2/${ABI}
          cd /tmp/argon2
          make clean 2>/dev/null || true
          make libargon2.a -j$(nproc) \
            CC="$CC" AR="$AR" RANLIB="$RANLIB" \
            CFLAGS="-O2 -fPIC -mthumb --sysroot=${SYSROOT} -DANDROID"
          cp libargon2.a ${{ env.OUT }}/argon2/${ABI}/
          make clean

          # ── SQLCipher ─────────────────────────────────────────────────────
          mkdir -p ${{ env.OUT }}/sqlcipher/${ABI}
          cd /tmp/sqlcipher
          make distclean 2>/dev/null || true
          ./configure \
            --build=x86_64-linux-gnu \
            --host="${TRIPLE}" \
            CC="${CC} --sysroot=${SYSROOT}" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CFLAGS="-O2 -fPIC -mthumb -DSQLITE_HAS_CODEC -DSQLITE_TEMP_STORE=2 -I${OPENSSL_OUT}/include" \
            LDFLAGS="-L${OPENSSL_OUT}/lib64 -L${OPENSSL_OUT}/lib" \
            LIBS="-lcrypto" \
            --enable-tempstore=yes \
            --with-crypto-lib=openssl \
            --disable-shared \
            --enable-static \
            ac_cv_func_posix_getpwuid_r=no \
            ac_cv_func_getpwuid_r=no \
            2>&1 | tail -10
          make -j$(nproc) libsqlcipher.la 2>&1 | tail -10
          find . -name "libsqlcipher.a" -exec cp {} ${{ env.OUT }}/sqlcipher/${ABI}/ \;
          echo "✓ ${ABI} complete"

      # ══════════════════════════════════════════════════════════════════════
      # x86_64
      # ══════════════════════════════════════════════════════════════════════
      - name: Build x86_64
        run: |
          set -euo pipefail
          ABI="x86_64"
          TRIPLE="x86_64-linux-android"
          OPENSSL_ARCH="android-x86_64"

          TOOLCHAIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          CC="${TOOLCHAIN}/bin/${TRIPLE}${{ env.API_LEVEL }}-clang"
          AR="${TOOLCHAIN}/bin/llvm-ar"
          RANLIB="${TOOLCHAIN}/bin/llvm-ranlib"
          OPENSSL_OUT="/tmp/openssl-${ABI}"

          export ANDROID_NDK_ROOT="${NDK_HOME}"
          export PATH="${TOOLCHAIN}/bin:${PATH}"

          # ── OpenSSL ───────────────────────────────────────────────────────
          cd /tmp/openssl
          make clean 2>/dev/null || true
          perl Configure ${OPENSSL_ARCH} \
            -D__ANDROID_API__=${{ env.API_LEVEL }} \
            --prefix="${OPENSSL_OUT}" \
            --openssldir="${OPENSSL_OUT}/ssl" \
            no-shared no-tests no-ui-console no-asm \
            2>&1 | tail -5
          make -j$(nproc) build_libs 2>&1 | tail -10
          make install_dev 2>&1 | tail -5

          # ── Argon2 ────────────────────────────────────────────────────────
          mkdir -p ${{ env.OUT }}/argon2/${ABI}
          cd /tmp/argon2
          make clean 2>/dev/null || true
          make libargon2.a -j$(nproc) \
            CC="$CC" AR="$AR" RANLIB="$RANLIB" \
            CFLAGS="-O3 -fPIC --sysroot=${SYSROOT} -DANDROID"
          cp libargon2.a ${{ env.OUT }}/argon2/${ABI}/
          make clean

          # ── SQLCipher ─────────────────────────────────────────────────────
          mkdir -p ${{ env.OUT }}/sqlcipher/${ABI}
          cd /tmp/sqlcipher
          make distclean 2>/dev/null || true
          ./configure \
            --build=x86_64-linux-gnu \
            --host="${TRIPLE}" \
            CC="${CC} --sysroot=${SYSROOT}" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CFLAGS="-O3 -fPIC -DSQLITE_HAS_CODEC -DSQLITE_TEMP_STORE=2 -I${OPENSSL_OUT}/include" \
            LDFLAGS="-L${OPENSSL_OUT}/lib64 -L${OPENSSL_OUT}/lib" \
            LIBS="-lcrypto" \
            --enable-tempstore=yes \
            --with-crypto-lib=openssl \
            --disable-shared \
            --enable-static \
            ac_cv_func_posix_getpwuid_r=no \
            ac_cv_func_getpwuid_r=no \
            2>&1 | tail -10
          make -j$(nproc) libsqlcipher.la 2>&1 | tail -10
          find . -name "libsqlcipher.a" -exec cp {} ${{ env.OUT }}/sqlcipher/${ABI}/ \;
          echo "✓ ${ABI} complete"

      # ── Verify ────────────────────────────────────────────────────────────
      - name: Verify outputs
        run: |
          echo "=== Built artifacts ==="
          FAIL=0
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            for LIB in sqlcipher argon2; do
              FILE="${{ env.OUT }}/${LIB}/${ABI}/lib${LIB}.a"
              if [ -f "$FILE" ]; then
                echo "  ✓ ${LIB}/${ABI}/lib${LIB}.a  ($(du -sh $FILE | cut -f1))"
              else
                echo "  ✗ MISSING: ${LIB}/${ABI}/lib${LIB}.a"
                FAIL=1
              fi
            done
          done
          [ -f "${{ env.OUT }}/sqlcipher/include/sqlite3.h" ] && \
            echo "  ✓ sqlcipher/include/sqlite3.h" || \
            { echo "  ✗ MISSING: sqlcipher/include/sqlite3.h"; FAIL=1; }
          [ -f "${{ env.OUT }}/argon2/include/argon2.h" ] && \
            echo "  ✓ argon2/include/argon2.h" || \
            { echo "  ✗ MISSING: argon2/include/argon2.h"; FAIL=1; }
          echo "  ✓ fmtlib: $(ls ${{ env.OUT }}/fmt/include/fmt/*.h 2>/dev/null | wc -l) headers"
          exit $FAIL

      # ── Commit back ───────────────────────────────────────────────────────
      - name: Commit native libs to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/cpp/third_party/
          if git diff --staged --quiet; then
            echo "No changes — libs already up to date."
          else
            git commit -m "ci: build native deps [SQLCipher ${{ env.SQLCIPHER_TAG }} / Argon2 ${{ env.ARGON2_REF }} / OpenSSL ${{ env.OPENSSL_TAG }}]

            ABIs: arm64-v8a, armeabi-v7a, x86_64
            NDK: ${{ env.NDK_VERSION }}  API: ${{ env.API_LEVEL }}
            Triggered by: ${{ github.actor }}"
            git push
          fi

      - name: Upload libs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cobe-native-libs
          path: src/cpp/third_party/
          retention-days: 30
